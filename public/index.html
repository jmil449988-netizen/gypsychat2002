<!-- force-rebuild: giphy key lockdown, cache clear retry -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gypsy Chat 2000</title>
<meta name="description" content="A small, old-school chat room.">
<meta name="theme-color" content="#141210">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gypsy Chat">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css?v=17">
</head>
<body>
<div class="gc-root">
<div class="win" role="application" aria-label="Gypsy Chat 2000">
<span class="corner bl" aria-hidden="true"></span><span class="corner br" aria-hidden="true"></span>
<div class="title"><span class="gem" aria-hidden="true"></span><span class="name">Gypsy Chat 2000</span><span class="gem" aria-hidden="true"></span></div>

<div class="body">
<div class="login" id="login">
<h1>Gypsy Chat 2000</h1>
<div class="rule"></div>
<div class="tag">Stay awhile, and chat.</div>
<label for="sn">Character name</label>
<input id="sn" class="sunk" maxlength="16" autocomplete="off" placeholder="e.g. xXsk8rXx">
<div class="admin-fields hidden" id="adminFields">
<label for="adminEmail">Admin email</label>
<input id="adminEmail" class="sunk" type="email" autocomplete="username">
<label for="adminPassword">Admin password</label>
<input id="adminPassword" class="sunk" type="password" autocomplete="current-password">
</div>
<div class="turnstile-wrap" id="turnstileWrap"><div class="cf-turnstile" id="cfTurnstile" data-sitekey="0x4AAAAAAEyldNKwDh4-t-S5" data-theme="dark" data-callback="onTurnstileSuccess" data-expired-callback="onTurnstileExpired" data-error-callback="onTurnstileExpired"></div></div>
<div class="err" id="err"></div>
<button class="btn" id="join" style="height:32px">Enter the room</button>
<div class="admin-toggle-wrap"><button type="button" class="admin-toggle" id="adminToggle">Admin login</button></div>
</div>

<div class="log sunk hidden" id="log" aria-live="polite" aria-label="Chat messages"></div>
<div class="users sunk hidden" id="users"><div class="hd">Online</div><div class="list" id="ulist"></div><div class="hd frhd">Friends</div><div class="list" id="flist"></div><div class="hint">Tap a name for options</div></div>

<div class="compose hidden" id="compose">
<button class="btn emo" id="emoBtn" aria-label="Insert emoji" title="Emoji">😊</button>
<button class="btn gif" id="gifBtn" aria-label="Search GIFs" title="GIF">GIF</button>
<div class="cooldown hidden" id="cooldownMsg" role="status" aria-live="polite"></div>
<textarea id="msg" class="sunk" maxlength="140" placeholder="Speak... Enter to send"></textarea>
<button class="btn" id="send">Send</button>
</div>
</div>

<div id="ims"></div>
<div id="imTray" class="im-tray"></div>
<div class="status"><span class="cell" id="st">Not signed on</span><button class="cell avabtn hidden" id="avaBtn" type="button" title="Set your profile picture" aria-label="Set your profile picture"><span class="ava-thumb" id="avaThumb">＋</span></button><input type="file" id="avaFile" class="hidden" accept="image/jpeg,image/png,image/gif,image/webp,image/heic,image/heif,.heic,.heif"><button class="cell statusbtn hidden" id="statusBtn" type="button" title="Set your status">● Online</button><button class="cell soundbtn" id="soundBtn" type="button" title="Toggle sounds" aria-label="Toggle sounds">🔊</button><button class="cell dmbtn" id="dmToggleBtn" type="button" title="Hide/show DM tabs" aria-label="Toggle DM tabs">💬</button><span class="cell" id="cnt">0 online</span></div>
</div>

<div class="picker" id="picker" role="listbox" aria-label="Emoji"></div>

<div class="gifpicker" id="gifPicker" role="dialog" aria-label="Search GIFs">
<div class="gsearch"><input id="gifQ" type="text" autocomplete="off" maxlength="60" placeholder="Search Giphy..."><button class="btn" type="button" id="gifGo">Go</button></div>
<div class="gresults" id="gifResults"></div>
</div>

<aside class="roulette-panel" aria-label="Gypsy Roulette announcement">
<div class="rp-eyebrow">Coming Soon</div>
<div class="rp-title">Gypsy<br>Roulette</div>
<div class="rp-rule"></div>
<div class="rp-blurb">Two minutes with a stranger.<br>Then the wheel turns again.</div>
<div class="rp-wheel" aria-hidden="true"><span>✦</span></div>
</aside>

<div class="threads-panel" id="threadsPanel" role="complementary" aria-label="Threads board">
<div class="tp-list" id="tpList">
<div class="tp-hd"><span>Threads</span></div>
<div class="tp-newwrap"><button class="btn tp-new" type="button" id="tpNewBtn">+ New Thread</button></div>
<div class="tp-newpost hidden" id="tpNewPost">
<textarea id="tpNewBody" class="sunk" maxlength="1000" placeholder="Post anything to start a thread..."></textarea>
<div class="tp-preview-wrap hidden" id="tpNewPreviewWrap"><img class="tp-preview-img" id="tpNewPreviewImg" alt="Selected image"><button class="tp-img-remove" type="button" id="tpNewImgRemove" aria-label="Remove image">✕</button></div>
<div class="tp-composebar">
<button class="btn tp-img" type="button" id="tpNewImgBtn" title="Attach image">🖼️ Image</button>
<button class="btn tp-img" type="button" id="tpNewGifBtn" title="Search GIFs">GIF</button>
<input type="file" id="tpNewImgFile" accept="image/jpeg,image/png,image/gif,image/webp,image/heic,image/heif,.heic,.heif" class="hidden">
</div>
<div class="tp-newactions"><button class="btn" type="button" id="tpNewCancel">Cancel</button><button class="btn" type="button" id="tpNewSubmit">Post</button></div>
</div>
<div class="tp-items" id="tpItems"></div>
</div>
<div class="tp-detail hidden" id="tpDetail">
<div class="tp-hd"><button class="tp-back" type="button" id="tpBack" aria-label="Back to threads">←</button><span>Thread</span></div>
<div class="tp-posts" id="tpPosts"></div>
<div class="tp-reply">
<div class="tp-reply-compose">
<textarea id="tpReplyBody" class="sunk" maxlength="1000" placeholder="Reply..."></textarea>
<div class="tp-preview-wrap hidden" id="tpReplyPreviewWrap"><img class="tp-preview-img" id="tpReplyPreviewImg" alt="Selected image"><button class="tp-img-remove" type="button" id="tpReplyImgRemove" aria-label="Remove image">✕</button></div>
<div class="tp-composebar">
<button class="btn tp-img" type="button" id="tpReplyImgBtn" title="Attach image">🖼️</button>
<button class="btn tp-img" type="button" id="tpReplyGifBtn" title="Search GIFs">GIF</button>
<input type="file" id="tpReplyImgFile" accept="image/jpeg,image/png,image/gif,image/webp,image/heic,image/heif,.heic,.heif" class="hidden">
</div>
</div>
<button class="btn" type="button" id="tpReplySend">Reply</button>
</div>
</div>
</div>

<button class="thread-toggle-fab" id="threadToggleBtn" type="button" aria-label="Open threads board">🧵</button>
</div>

<div class="modal-overlay hidden" id="warnOverlay">
<div class="modal" role="alertdialog" aria-modal="true" aria-live="assertive" aria-label="Chat warning">
<div class="modal-hd" id="warnTitle">Warning</div>
<div class="modal-body" id="warnBody"></div>
<button class="btn" type="button" id="warnOk">OK</button>
</div>
</div>

<div class="modal-overlay hidden" id="infoOverlay">
<div class="modal" role="dialog" aria-modal="true" aria-label="Profile info">
<div class="modal-hd" id="infoTitle">Name</div>
<div class="modal-body" id="infoBody"></div>
<button class="btn" type="button" id="infoOk">OK</button>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<!-- Converts iPhone HEIC/HEIF photos to JPEG in the browser before upload -- no browser can decode
     HEIC itself in an <img>/<canvas>, so without this, photos straight from an iPhone camera roll
     (when the OS hands them over unconverted) fail to upload as profile pictures or image posts. -->
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js" defer></script>
<script src="./js/appconfig.js?v=1"></script>
<script src="./js/app.js?v=24"></script>
</body>
</html>
